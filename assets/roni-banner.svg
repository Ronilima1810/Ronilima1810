 <radialGradient id="halo"><stop stop-color="#11B3E2" stop-opacity=".35"/><stop offset="1" stop-color="#0070C9" stop-opacity="0"/></radialGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="clip"><rect width="1200" height="380" rx="22"/></clipPath>
 <style>
 .flow{stroke-dasharray:10 13;animation:flow 10s linear infinite}
 .spark{animation:blink 2.9s ease-in-out infinite;transform-origin:center}
 .cursor{animation:blink .9s steps(1,end) infinite}
 .float{animation:float 5s ease-in-out infinite}
 .breath{animation:pulse 4s ease-in-out infinite}
 .scan{animation:sweep 5.5s ease-in-out infinite}
 @keyframes flow{to{stroke-dashoffset:-276}}
 @keyframes blink{0%,46%,100%{opacity:.98}50%,83%{opacity:.15}}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
 @keyframes pulse{0%,100%{opacity:.42}50%{opacity:.96}}
 @keyframes sweep{0%{transform:translateY(-120px);opacity:0}15%{opacity:.4}85%{opacity:.35}100%{transform:translateY(175px);opacity:0}}
 @media (prefers-reduced-motion:reduce){.flow,.spark,.cursor,.float,.breath,.scan{animation:none}}
 </style>
</defs>
