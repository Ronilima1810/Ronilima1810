<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Roni Lima — Data, Software &amp; Automation">
<title>Roni Lima — Data, Software &amp; Automation</title>
<desc>Banner cyber-tech futurista com programador de fones, monitores de código, globo holográfico e circuito neon animado.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020914"/><stop offset=".46" stop-color="#071629"/><stop offset="1" stop-color="#03101E"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1"><stop stop-color="#12E9FF"/><stop offset=".55" stop-color="#43D8F8"/><stop offset="1" stop-color="#467AE5"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="1"><stop stop-color="#020913" stop-opacity=".98"/><stop offset=".70" stop-color="#020913" stop-opacity=".74"/><stop offset="1" stop-color="#020913" stop-opacity="0"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#078BCA" stop-opacity=".32"/><stop offset="1" stop-color="#078BCA" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="bigGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="crop"><rect width="1200" height="380" rx="22"/></clipPath>
<style>
.circuit-flow{stroke-dasharray:12 16;animation:move 9s linear infinite}
.cursor{animation:blink 1s steps(1,end) infinite}
.pulse{animation:glimmer 3.6s ease-in-out infinite}
.floating{animation:float 5s ease-in-out infinite}
.floating-delayed{animation:float 6s ease-in-out infinite reverse}
@keyframes move{to{stroke-dashoffset:-280}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.08}}
@keyframes glimmer{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.circuit-flow,.cursor,.pulse,.floating,.floating-delayed{animation:none}}
</style></defs>
