<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Roni Lima — Data, Software &amp; Automation — painel tecnológico animado">
<title>Roni Lima — Data, Software &amp; Automation</title>
<desc>Banner futurista azul ciano com desenho vetorial em código, programador, terminais e circuitos animados.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020714"/><stop offset=".45" stop-color="#071428"/><stop offset="1" stop-color="#041529"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1"><stop stop-color="#1DF3FF"/><stop offset=".53" stop-color="#44C8FB"/><stop offset="1" stop-color="#396BEE"/></linearGradient>
