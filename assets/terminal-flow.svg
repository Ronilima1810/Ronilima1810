<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="176" viewBox="0 0 1200 176" role="img" aria-label="Painel animado de código, dados e automação">
<title>Code, Data &amp; Automation</title>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071320"/><stop offset="1" stop-color="#081F35"/></linearGradient>
 <linearGradient id="ac" x1="0" x2="1"><stop stop-color="#28ECF8"/><stop offset="1" stop-color="#249BEC"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
 .blink{animation:blink 1.2s steps(1,end) infinite}
 .stream{animation:stream 7s linear infinite;stroke-dasharray:6 12}
 .pulse{animation:pulse 3.1s ease-in-out infinite}
 @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.1}}
 @keyframes stream{to{stroke-dashoffset:-234}}
 @keyframes pulse{0%,100%{opacity:.35}55%{opacity:1}}
 @media (prefers-reduced-motion:reduce){.blink,.stream,.pulse{animation:none}}
 </style>
</defs>
<rect x="1" y="1" width="1198" height="174" rx="18" fill="url(#bg)" stroke="#267395" stroke-width="2"/>
